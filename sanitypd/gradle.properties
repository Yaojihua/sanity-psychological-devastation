# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

mod_id=sanitypd
spec_version=1
mod_version=1.1.1
developer=Yaojihua
archives_base_name=sanitypd

minecraft_version=1.20
mc_display_version=mc1.20
forge_version=46.0.14

geckolib_version=4.2
# GeckoLib artifact suffix (NOT minecraft_version): the "geckolib-forge-1.20" artifact only has 4.2,
# while 4.2.1 ~ 4.8.4 live under "geckolib-forge-1.20.1". Bump both values together.
geckolib_mc_version=1.20
# Jade: optional soft dependency, compile-time only (adds a sanity line to its tooltip).
jade_version=11.13.3+forge
parchment_version=2023.03.12-1.19.3
mappings_channel=official
mappings_version=1.20